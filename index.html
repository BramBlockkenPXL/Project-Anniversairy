<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <!-- Viewport settings voor iOS webapp (voorkomt inzoomen) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mission">
    <meta name="theme-color" content="#050505">
    
    <!-- Homescreen Icoon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23050505%22/><text x=%2250%22 y=%2265%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%2310b981%22 font-family=%22monospace%22 text-anchor=%22middle%22>>_</text></svg>">

    <title>Classified Mission Briefing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #064e3b 0%, #000000 100%);
            color: #10b981; /* Emerald 500 */
            /* Voorkomt tekstselectie voor een native app-gevoel op iOS */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Radar / Grid Background */
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
        }

        /* Radar Scanline */
        .scanline {
            width: 100%;
            height: 150px;
            background: linear-gradient(0deg, rgba(16, 185, 129, 0) 0%, rgba(16, 185, 129, 0.15) 50%, rgba(16, 185, 129, 0) 100%);
            position: absolute;
            bottom: 100%;
            animation: scanline 6s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -150px; }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #10b981;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .glow-text { text-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
        .glow-box { box-shadow: 0 0 20px rgba(16, 185, 129, 0.15), inset 0 0 20px rgba(16, 185, 129, 0.05); }
        
        .btn-cyber {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }
        .btn-cyber::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.4), transparent);
            transition: all 0.4s ease;
        }
        .btn-cyber:hover::before, .btn-cyber:active::before { left: 100%; }
        
        /* Utility to hide scrollbars but keep functionality */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden selection:bg-emerald-900 selection:text-white">

    <div class="bg-grid"></div>
    <div class="scanline"></div>

    <main class="relative z-10 w-full max-w-xl p-6 sm:p-10 mx-4 bg-black/80 backdrop-blur-md border border-emerald-500/30 rounded-lg glow-box">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex justify-center items-center gap-2 mb-3">
                <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_rgba(220,38,38,0.8)]"></div>
                <span class="text-red-500 text-xs font-bold tracking-[0.2em] uppercase">Highly Classified</span>
            </div>
            <h1 class="text-2xl sm:text-4xl font-bold text-emerald-400 tracking-tight mb-2 uppercase glow-text">
                Op: Anniversary
            </h1>
            <div class="text-emerald-700 text-xs tracking-widest uppercase">Agent clearance: MARIGOLD</div>
            <div class="h-px w-full bg-gradient-to-r from-transparent via-emerald-500/50 to-transparent my-5"></div>
        </div>

        <!-- Interactive Section -->
        <div id="action-area" class="min-h-[120px] flex flex-col items-center justify-center mb-8">
            <!-- Decrypt Button -->
            <button id="decrypt-btn" onclick="revealMessage()" class="btn-cyber hidden bg-emerald-900/40 border border-emerald-500 text-emerald-400 px-6 py-3 rounded text-sm sm:text-base uppercase tracking-widest hover:bg-emerald-800/60 hover:text-white hover:shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all">
                [ Decrypt New Transmission ]
            </button>

            <!-- Terminal Window -->
            <div id="terminal-window" class="w-full bg-black/90 border border-emerald-800 p-5 rounded relative shadow-[inset_0_0_15px_rgba(0,0,0,1)] hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-800 via-emerald-400 to-emerald-800 opacity-50"></div>
                <p id="typewriter-text" class="text-emerald-400 text-sm sm:text-base leading-relaxed whitespace-pre-wrap"></p>
            </div>
        </div>

        <!-- Countdown Section -->
        <div id="countdown-wrapper" class="border-t border-emerald-900/50 pt-6">
            <p id="countdown-label" class="text-center text-emerald-600 text-xs uppercase tracking-[0.2em] mb-4">Time to next phase:</p>
            <div class="grid grid-cols-4 gap-2 sm:gap-4">
                <div class="bg-black/60 border border-emerald-900/50 rounded p-2 sm:p-3 text-center">
                    <div id="days" class="text-2xl sm:text-4xl font-bold text-emerald-500 glow-text">00</div>
                    <div class="text-[9px] sm:text-xs text-emerald-700 uppercase tracking-widest mt-1">Days</div>
                </div>
                <div class="bg-black/60 border border-emerald-900/50 rounded p-2 sm:p-3 text-center">
                    <div id="hours" class="text-2xl sm:text-4xl font-bold text-emerald-500 glow-text">00</div>
                    <div class="text-[9px] sm:text-xs text-emerald-700 uppercase tracking-widest mt-1">Hrs</div>
                </div>
                <div class="bg-black/60 border border-emerald-900/50 rounded p-2 sm:p-3 text-center">
                    <div id="minutes" class="text-2xl sm:text-4xl font-bold text-emerald-500 glow-text">00</div>
                    <div class="text-[9px] sm:text-xs text-emerald-700 uppercase tracking-widest mt-1">Min</div>
                </div>
                <div class="bg-black/60 border border-emerald-900/50 rounded p-2 sm:p-3 text-center">
                    <div id="seconds" class="text-2xl sm:text-4xl font-bold text-emerald-500 glow-text">00</div>
                    <div class="text-[9px] sm:text-xs text-emerald-700 uppercase tracking-widest mt-1">Sec</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Debug Controls -->
    

    <script>
        // --- PHASE CONFIGURATION ---
        const phases = [
            {
                id: 0,
                unlockTime: 0, 
                // Timer telt af naar 24 okt 22:00
                nextTime: new Date("2026-10-24T22:00:00").getTime(),
                message: "STATUS: STAND-BY // OP: ANNIVERSARY\n\nWacht op activering van het protocol. Zorg dat je velduitrusting klaarstaat en je agenda is geblokkeerd.\n\nEerste dispatch volgt exact op 24 oktober om 20:00. Houd deze frequentie open."
            },
            {
                id: 1,
                // Unlocks 24 okt, 22:00. Timer telt af naar 25 okt 11:00.
                unlockTime: new Date("2026-10-24T22:00:00").getTime(),
                nextTime: new Date("2026-10-25T11:00:00").getTime(),
                message: "FASE 1: CONTACTPUNT GELOKALISEERD\n\nRendez-vous: 50.929464, 5.338139\nTijdstip: 10:00 sharp.\n\nDoel: Bevoorrading en briefingsessie. We draaien hier eerst een snel voorbereidend programma om met een zuivere lei aan de dag te beginnen."
            },
            {
                id: 2,
                // Unlocks 25 okt, 11:00. Timer telt af naar 25 okt 17:00.
                unlockTime: new Date("2026-10-25T11:00:00").getTime(),
                nextTime: new Date("2026-10-25T17:00:00").getTime(),
                message: "FASE 2: TACTISCH TRAJECT\n\nNavigeer naar sector: 51.399758, 6.170844\nGeschatte aankomst: 16:00.\n\nIntel meldt een low-light zone met afwijkende optische omstandigheden. Richten, kalm blijven en de juiste hoek kiezen; het komt aan op millimeters."
            },
            {
                id: 3,
                // Unlocks 25 okt, 17:00. Geen timer meer.
                unlockTime: new Date("2026-10-25T17:00:00").getTime(),
                nextTime: null, 
                message: "FASE 3: FINALE PROTOCOL\n\nCoördinaten: 51.473046, 6.185681\nStatus: Eindfase actief.\n\nEen historisch domein dat pas tot leven komt wanneer het daglicht volledig verdwijnt. Volg de verlichte corridors tot aan het eindpunt."
            }
        ];

        // --- STATE MANAGEMENT ---
        let currentDebugPhase = -1; // -1 means use real time
        let activePhaseId = -1;
        let revealedPhaseId = -1; 
        let isTyping = false;
        let typeTimeout;
        let debugTickStart = 0;

        // Elements
        const decryptBtn = document.getElementById('decrypt-btn');
        const terminalWindow = document.getElementById('terminal-window');
        const typewriterElement = document.getElementById('typewriter-text');
        const countdownWrapper = document.getElementById('countdown-wrapper');

        function getCurrentPhase() {
            if (currentDebugPhase !== -1) return phases[currentDebugPhase];
            
            const now = new Date().getTime();
            let current = phases[0];
            for (let i = 1; i < phases.length; i++) {
                if (now >= phases[i].unlockTime) {
                    current = phases[i];
                }
            }
            return current;
        }

        function revealMessage() {
            const phase = getCurrentPhase();
            revealedPhaseId = phase.id;
            
            decryptBtn.classList.add('hidden');
            terminalWindow.classList.remove('hidden');
            
            clearTimeout(typeTimeout);
            typewriterElement.innerHTML = '';
            typewrite(phase.message, 0);
        }

        // --- TYPEWRITER EFFECT ---
        function typewrite(text, index) {
            isTyping = true;

            if (index < text.length) {
                if (text.substring(index, index + 1) === '\n') {
                    typewriterElement.innerHTML += '<br>';
                } else {
                    typewriterElement.innerHTML += text.charAt(index);
                }
                
                let cursor = document.getElementById('cursor');
                if (!cursor) {
                    cursor = document.createElement('span');
                    cursor.id = 'cursor';
                    cursor.className = 'cursor';
                }
                typewriterElement.appendChild(cursor);

                let typingSpeed = Math.floor(Math.random() * 30) + 20; 
                if (['.', ',', ':'].includes(text.charAt(index))) typingSpeed += 200; 
                if (text.charAt(index) === '\n') typingSpeed += 300; 

                typeTimeout = setTimeout(() => {
                    typewrite(text, index + 1);
                }, typingSpeed);
            } else {
                isTyping = false;
            }
        }

        // --- MAIN GAME LOOP ---
        function updateLogic() {
            const phase = getCurrentPhase();

            if (phase.id !== activePhaseId) {
                activePhaseId = phase.id;
                
                if (revealedPhaseId !== phase.id) {
                    clearTimeout(typeTimeout);
                    terminalWindow.classList.add('hidden');
                    decryptBtn.classList.remove('hidden');
                    decryptBtn.innerText = phase.id === 0 ? "[ INITIATE CONNECTION ]" : "[ DECRYPT NEW TRANSMISSION ]";
                }

                if (phase.nextTime === null) {
                    countdownWrapper.style.display = 'none';
                } else {
                    countdownWrapper.style.display = 'block';
                }
            }

            if (phase.nextTime !== null) {
                const now = new Date().getTime();
                let distance = phase.nextTime - now;
                
                // Zorgt dat de debug timer echt aftelt (1 uur en 1 minuut) vanaf het moment dat je op de debug knop drukt
                if (currentDebugPhase !== -1) {
                    distance = 3660000 - (now - debugTickStart);
                    if (distance < 0) distance = 0;
                }

                if (distance > 0) {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById("days").innerText = days.toString().padStart(2, '0');
                    document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
                    document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
                    document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
                } else if (currentDebugPhase === -1) {
                    activePhaseId = -1; 
                }
            }
        }

        // --- DEBUG CONTROLS ---
        function cycleDebugPhase() {
            currentDebugPhase++;
            if (currentDebugPhase >= phases.length) {
                currentDebugPhase = -1; 
            }
            
            debugTickStart = new Date().getTime(); // Slaat de starttijd van de debug fase op
            
            document.getElementById('debug-state').innerText = 
                currentDebugPhase === -1 ? 'REALTIME' : `PHASE ${currentDebugPhase}`;
            
            revealedPhaseId = -1; 
            updateLogic();
        }

        // Initialize and start loop
        updateLogic();
        setInterval(updateLogic, 1000);

    </script>
</body>
</html>
