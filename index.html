<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <!-- Viewport settings voor mobiel (voorkomt inzoomen) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mission">
    <meta name="theme-color" content="#050505">
    
    <!-- Een simpel icoontje voor op het homescreen (>_ symbool) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23050505%22/><text x=%2250%22 y=%2265%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%230f0%22 font-family=%22monospace%22 text-anchor=%22middle%22>>_</text></svg>">

    <title>Operation: Anniversary</title>
    <style>
        body { 
            background: #050505; color: #0f0; font-family: monospace; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 100vh; margin: 0; 
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        .scanline { 
            width: 100%; height: 100px; 
            background: linear-gradient(0deg, rgba(0,255,0,0) 0%, rgba(0,255,0,0.2) 50%, rgba(0,255,0,0) 100%); 
            position: absolute; top: -100px; 
            animation: scan 6s linear infinite; pointer-events: none; 
        }
        @keyframes scan { 0% { top: -100px; } 100% { top: 100vh; } }
        
        .container { text-align: center; z-index: 10; width: 90%; max-width: 600px; padding: 20px; }
        h1 { font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { font-size: 0.8rem; opacity: 0.7; margin-bottom: 30px; }
        
        .timer-box { border: 1px solid #0f0; padding: 20px; background: rgba(0, 255, 0, 0.05); margin-bottom: 30px; }
        .timer { font-size: 2.5rem; font-weight: bold; letter-spacing: 3px; }
        .timer-label { font-size: 0.7rem; margin-top: 10px; opacity: 0.8; }
        
        .btn { 
            background: transparent; color: #0f0; border: 1px solid #0f0; 
            padding: 15px 30px; font-family: monospace; font-size: 1.1rem; 
            cursor: pointer; text-transform: uppercase; transition: all 0.3s; 
            margin-top: 20px; width: 100%; touch-action: manipulation;
        }
        .btn:active { background: #0f0; color: #000; }
        
        .terminal { 
            text-align: left; background: rgba(0,0,0,0.8); border: 1px solid #0f0; 
            padding: 20px; min-height: 150px; display: none; margin-top: 20px; 
            white-space: pre-wrap; font-size: 0.9rem; line-height: 1.5; 
        }
        .cursor { 
            display: inline-block; width: 8px; height: 15px; background: #0f0; 
            animation: blink 1s step-end infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .debug-btn { 
            position: fixed; bottom: 10px; right: 10px; opacity: 0.05; 
            cursor: pointer; background: none; border: 1px solid #0f0; 
            color: #0f0; font-size: 10px; padding: 5px;
        }
        .debug-btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="container">
        <h1>Operation: Anniversary</h1>
        <div class="subtitle">STATUS: <span id="status-text">STANDBY</span></div>

        <div class="timer-box">
            <div class="timer" id="timer">00:00:00</div>
            <div class="timer-label" id="timer-label">T-MINUS UNTIL FIRST TRANSMISSION</div>
        </div>

        <button class="btn" id="decode-btn" style="display: none;">Decode Message</button>
        
        <div class="terminal" id="terminal">
            <span id="typed-text"></span><span class="cursor"></span>
        </div>
    </div>

    <button class="debug-btn" onclick="nextDebugPhase()">Dev: Skip Phase</button>

    <script>
        const phases = [
            {
                unlockTime: new Date('2026-10-29T20:00:00').getTime(),
                message: "MISSION UPDATE 01:\n\nGood morning, VIP Driver.\nYour first waypoint has been verified.\n\nInput coordinates into navigation:\n[ 50.929464, 5.338139 ]\n\nEnsure you arrive exactly at 10:00. Breakfast briefing will commence upon arrival."
            },
            {
                unlockTime: new Date('2026-10-30T11:00:00').getTime(),
                message: "MISSION UPDATE 02:\n\nTarget 1 acquired. Proceeding to Phase 2.\n\nNew coordinates decrypted:\n[ 51.399758, 6.170844 ]\n\nETA required: 16:00.\nObjective: Taurus World Golf.\nReservation confirmed under alias: Blockken."
            },
            {
                unlockTime: new Date('2026-10-30T17:30:00').getTime(),
                message: "FINAL MISSION UPDATE:\n\nSunset protocol initiated.\nProceed to final coordinates:\n[ 51.473046, 6.185681 ]\n\nAccess window: 18:00 - 21:00.\nObjective: Enchanted Gardens.\n\nHappy 2nd Anniversary."
            }
        ];

        let currentPhase = -1;
        let debugPhase = -1;
        let debugTickStart = 0;
        let isTyping = false;
        let typeInterval;

        function updateClock() {
            if(isTyping) return;

            const now = new Date().getTime();
            let actualPhase = -1;
            
            for (let i = 0; i < phases.length; i++) {
                if (now >= phases[i].unlockTime) {
                    actualPhase = i;
                }
            }

            const activePhase = debugPhase !== -1 ? debugPhase : actualPhase;
            let nextUnlock = null;
            
            if (activePhase < phases.length - 1) {
                nextUnlock = phases[activePhase + 1].unlockTime;
            }

            if (activePhase !== currentPhase) {
                currentPhase = activePhase;
                document.getElementById('terminal').style.display = 'none';
                document.getElementById('typed-text').innerText = '';
                
                if (currentPhase >= 0) {
                    document.getElementById('status-text').innerText = `PHASE ${currentPhase + 1} ACTIVE`;
                    document.getElementById('status-text').style.color = '#fff';
                    document.getElementById('decode-btn').style.display = 'block';
                } else {
                    document.getElementById('status-text').innerText = 'STANDBY';
                    document.getElementById('status-text').style.color = '#0f0';
                    document.getElementById('decode-btn').style.display = 'none';
                }
            }

            if (nextUnlock) {
                let distance = nextUnlock - now;
                
                // Bugfix: De debug timer tikt nu echt netjes af in plaats van elke seconde te resetten naar 1 uur
                if(debugPhase !== -1) { 
                    distance = 3600000 - (now - debugTickStart); 
                    if(distance < 0) distance = 0;
                } 

                if (distance >= 0) {
                    const h = Math.floor(distance / (1000 * 60 * 60));
                    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    document.getElementById('timer').innerText = 
                        `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    
                    document.getElementById('timer-label').innerText = debugPhase !== -1 
                        ? "T-MINUS UNTIL NEXT TRANSMISSION (DEBUG MODE)" 
                        : "T-MINUS UNTIL NEXT TRANSMISSION";
                }
            } else {
                document.getElementById('timer').innerText = "00:00:00";
                document.getElementById('timer-label').innerText = "ALL TRANSMISSIONS DECRYPTED";
            }
        }

        document.getElementById('decode-btn').addEventListener('click', () => {
            if(currentPhase >= 0 && currentPhase < phases.length) {
                document.getElementById('decode-btn').style.display = 'none';
                document.getElementById('terminal').style.display = 'block';
                typeText(phases[currentPhase].message);
            }
        });

        function typeText(text) {
            isTyping = true;
            let i = 0;
            document.getElementById('typed-text').innerText = '';
            clearInterval(typeInterval);
            typeInterval = setInterval(() => {
                document.getElementById('typed-text').innerText += text.charAt(i);
                i++;
                if (i >= text.length) {
                    clearInterval(typeInterval);
                    isTyping = false;
                }
            }, 40); 
        }

        function nextDebugPhase() {
            debugPhase++;
            if (debugPhase >= phases.length) {
                debugPhase = -1; 
            }
            debugTickStart = new Date().getTime(); // Reset de debug klok per fase
            currentPhase = -2; 
            updateClock();
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
